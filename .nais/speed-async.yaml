apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: speed-async
  namespace: tbd
  labels:
    team: tbd
spec:
  strategy:
    type: RollingUpdate
  replicas:
    min: 2
    max: 24
    scalingStrategy:
      kafka:
        topic: tbd.rapid.v1
        consumerGroup: tbd-speed-v1
        threshold: 200
  liveness:
    path: /isalive
  readiness:
    path: /isready
  resources:
    limits:
      memory: 1024Mi
  prometheus:
    enabled: true
    path: /metrics
  preStopHook:
    http:
      path: /stop
  observability:
    autoInstrumentation:
      enabled: true
      runtime: java
    logging:
      destinations:
        - id: elastic
        - id: loki
  accessPolicy:
    outbound:
      rules:
        - application: logging
          namespace: nais-system
        - application: speed-api
  azure:
    application:
      enabled: true
  env:
    - name: KAFKA_RAPID_TOPIC
      value: tbd.rapid.v1
    - name: KAFKA_CONSUMER_GROUP_ID
      value: tbd-speed-v1
    - name: KAFKA_RESET_POLICY
      value: LATEST
